const DEFAULT_EVENTS=[{id:'ev1',title:'Board game night',category:'Games',date:dates(1,19),place:'W3 Dorm lounge',desc:'Bring your favorite game or just show up! Beginners absolutely welcome.',host:'minji',capacity:8,visibility:'All KAIST',going:['minji','jae','soo','hana'],maybe:['ken'],no:[],checked:[],messages:[{who:'Minji',text:'Bring a game if you have one!'}],photos:[],question:'Any snacks or dietary preferences?',answers:{}},{id:'ev2',title:'Dinner at Cafeteria 2',category:'Meals',date:dates(2,18),place:'Cafeteria 2',desc:'Let’s grab dinner after a long week. Come even if we have never met!',host:'jae',capacity:8,visibility:'All KAIST',going:['jae','yuri','ken'],maybe:[],no:[],checked:[],messages:[],photos:[],question:'Any food restrictions?',answers:{}},{id:'ev3',title:'CE301 midterm study',category:'Study',date:dates(3,14),place:'KAIST Library, 2F',desc:'Work through practice problems together. Bring your lecture notes.',host:'minji',capacity:6,visibility:'All KAIST',going:['minji','hana'],maybe:[],no:[],checked:[],messages:[],photos:[],question:'Which topic should we cover?',answers:{}},{id:'ev4',title:'Sunset basketball',category:'Sports',date:dates(4,17),place:'Sports field A',desc:'Casual half-court games. Any skill level welcome!',host:'ken',capacity:10,visibility:'All KAIST',going:['ken','soo','jae'],maybe:[],no:[],checked:[],messages:[],photos:[],question:'Your skill level?',answers:{}},{id:'ev5',title:'Climbing Club meetup',category:'Clubs',date:dates(5,16),place:'Campus gym',desc:'Try climbing and meet the climbing crew.',host:'hana',capacity:12,visibility:'All KAIST',going:['hana','minji'],maybe:[],no:[],checked:[],messages:[],photos:[],question:'Have you climbed before?',answers:{}},{id:'ev6',title:'Coffee & a little walk',category:'Outside',date:dates(1,15),place:'Duck Pond',desc:'A relaxed afternoon walk around campus. No agenda, just good company.',host:'yuri',capacity:6,visibility:'All KAIST',going:['yuri','jae'],maybe:[],no:[],checked:[],messages:[],photos:[],question:'',answers:{}}];DEFAULT_EVENTS[0].firstTimers=true;DEFAULT_EVENTS[0].hostAs='Me';DEFAULT_EVENTS[1].mealType='Cafeteria';DEFAULT_EVENTS[1].firstTimers=true;DEFAULT_EVENTS[2].course='CE301';DEFAULT_EVENTS[2].firstTimers=true;DEFAULT_EVENTS[3].sport='Basketball';DEFAULT_EVENTS[3].level='All levels';DEFAULT_EVENTS[3].slot='17:00–18:00';DEFAULT_EVENTS[4].hostAs='Climbing Club';DEFAULT_EVENTS[4].verified=true;DEFAULT_EVENTS[4].firstTimers=true;DEFAULT_EVENTS.push({id:'ev7',title:'Freshman dinner mixer',category:'Meals',date:dates(3,18),place:'Cafeteria 2',desc:'An open dinner for new students. Meal covered by Student Life Team (demo event).',host:'minji',hostAs:'Student Life Team',verified:true,sponsor:'Meal covered by Student Life Team',firstTimers:true,capacity:24,visibility:'All KAIST',going:['minji','jae','ken'],maybe:[],no:[],checked:[],messages:[],photos:[],question:'Any food preferences?',answers:{},mealType:'Cafeteria'});const DEFAULT_GROUPS=[{id:'g1',name:'CE301 Study Crew',type:'Class',desc:'Study sessions, lecture notes, and exam prep.',members:['minji','hana']},{id:'g2',name:'Climbing Club',type:'Club',desc:'Meet climbers around campus.',members:['hana','minji','ken']},{id:'g3',name:'W3 Dorm Hangouts',type:'Dorm',desc:'Food orders and spontaneous dorm lounge events.',members:['jae','soo']},{id:'g4',name:'Board Game Crew',type:'Friends',desc:'An excuse to play games every week.',members:['minji','soo','hana']}];
function load(){return{user:null,events:[],groups:[],friends:[],notifications:[],photoData:{},invites:{},preferences:{},groupInvites:{},requests:{}}}let db=load();db.invites=db.invites||{};db.preferences=db.preferences||{};db.notifications=db.notifications||[];db.groupInvites=db.groupInvites||{};let page='home',filter='All',query='',selected=null,modalTab='about',authMode='signup',selectedPreset='Meals',toastTimer=null,viewPerson=null;const save=()=>{};const me=()=>db.user?.id||'signed-out';const escapeHTML=(v)=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));const person=id=>id===me()?{...db.user,id:me()}:PEOPLE.find(p=>p.id===id)||{id,name:id||'Someone',major:'KAIST',year:'Student',interests:[],classes:[]};const initials=n=>(n||'U').split(' ').map(t=>t[0]).slice(0,2).join('').toUpperCase();const dateFmt=d=>new Date(d).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});const timeFmt=d=>new Date(d).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});const av=(id)=>`<span class="avatar" title="${escapeHTML(person(id).name)}">${escapeHTML(initials(person(id).name))}</span>`;const color=c=>(CATEGORY[c]||CATEGORY.Other).color;const emoji=c=>(CATEGORY[c]||CATEGORY.Other).emoji;function notify(msg){$('.toast')?.remove();let n=document.createElement('div');n.className='toast';n.textContent=msg;document.body.appendChild(n);clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.remove(),3000)}function navigate(p){page=p;filter='All';query='';selected=null;render();window.scrollTo(0,0)}function gated(fn){if(!db.user){notify('Create your KAIST demo profile first');navigate('welcome');return}fn()}
function canViewEvent(e){return e.visibility==='All KAIST'||e.host===me()||e.going.includes(me())||e.maybe.includes(me())||(e.visibility==='Friends only'&&db.friends.includes(e.host))||(e.invited||[]).includes(me())||(db.invites[e.id]||[]).includes(me())}function header(){return `<header class="topbar"><div class="container header"><div class="brand" role="button" onclick="navigate('home')">kather<span>.</span></div><nav class="nav">${[['home','Discover'],['people','Explore friends'],['map','Campus map'],['groups','Groups'],['my','My events']].map(([k,v])=>`<button class="${page===k?'active':''}" onclick="navigate('${k}')">${v}</button>`).join('')}</nav><div class="rightbar"><input class="searchbar" placeholder="⌕  Find an event..." value="${escapeHTML(query)}" oninput="query=this.value;renderFeedOnly()"><button class="bell-button" aria-label="Notifications" title="Notifications" onclick="toggleNotificationDropdown(event)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>${unreadCount()?`<span class="bell-count">${Math.min(unreadCount(),99)}</span>`:""}</button><button class="circle" onclick="navigate('profile')">${escapeHTML(initials(db.user?.name||'Me'))}</button></div></div></header><nav class="mobile-nav">${[['home','⌂','Home'],['people','♡','People'],['create','＋','Host'],['notifications','♧','Alerts'],['profile','☺','Me']].map(([k,ic,t])=>`<button class="${page===k?'active':''}" onclick="${k==='create'?"gated(()=>navigate('create'))":k==='notifications'?"toggleNotificationDropdown(event)":`navigate('${k}')`}"><span class="ico">${ic}</span>${t}</button>`).join('')}</nav>`}
function card(e){const isOwn=e.host===me();const friends=e.going.filter(x=>db.friends.includes(x)).length;return `<article class="event-card" role="button" tabindex="0" onclick="openEvent('${e.id}')" onkeydown="if(event.key==='Enter')openEvent('${e.id}')"><div class="event-art" style="background:${color(e.category)}"><span class="category-label">${escapeHTML(e.category)}${isPast(e)?" · Archive":""}</span><div class="event-emoji">${emoji(e.category)}</div></div><div class="event-body"><span class="small bold" style="color:#6a786f">${dateFmt(e.date)} · ${timeFmt(e.date)}</span><h3>${escapeHTML(e.title)}</h3><p>📍 ${escapeHTML(e.place)}<br>Hosted by ${escapeHTML(e.hostAs&&e.hostAs!=='Me'?e.hostAs:person(e.host).name)} ${e.verified?'✓ Verified':''} ${isOwn?'· You':''}</p><div class="card-footer"><span class="avatars">${e.going.slice(0,4).map(av).join('')}</span><span class="small muted">${e.going.length}/${e.capacity} going${friends?' · '+friends+' friends':''}${e.firstTimers?' · First-timers welcome':''}</span></div></div></article>`}
function feed(){const events=db.events.filter(e=>canViewEvent(e)&&!isPast(e)).filter(e=>filter==='All'||e.category===filter).filter(e=>(e.title+' '+e.place+' '+e.category).toLowerCase().includes(query.toLowerCase())).sort((a,b)=>new Date(a.date)-new Date(b.date));return events.length?`<div class="event-grid">${events.map(card).join('')}</div>`:'<div class="empty">No events match yet. Try another filter or host your own! ✨</div>'}
function renderFeedOnly(){let el=$('#feed');if(el)el.innerHTML=feed()}
function home(){return `<div class="hero"><div class="hero-left"><div class="eyebrow">Your campus, your people ✳</div><h1>Good things<br>happen together.</h1><p>From study buddies to midnight meals—find your people in the things you already love doing.</p><button class="primary" onclick="gated(()=>navigate('create'))">＋ Host something <span>↗</span></button></div><div class="hero-right"><div><div class="eyebrow">YOUR CAMPUS COMMUNITY ✦</div><h3>Discover your people.</h3></div><div><p>Meet students across KAIST, find shared interests and send a friend request.</p><button class="outline" style="margin-top:15px" onclick="navigate('people')">Explore friends →</button></div></div></div><div class="section-head"><div><div class="eyebrow" style="margin-bottom:7px">DISCOVER</div><h2>Happening around KAIST</h2></div><span class="small muted desktop-only">Made for real-life connections ↗</span></div><div class="filter-row">${['All','Meals','Sports','Study','Games','Clubs','Outside'].map(c=>`<button class="chip ${filter===c?'active':''}" onclick="filter='${c}';render()">${c==='All'?'✳ All':emoji(c)+' '+c}</button>`).join('')}</div><div id="feed">${feed()}</div>${db.friends.length===0?`<div class="panel" style="margin-top:22px"><h3>Start with people who share your interests 🌱</h3><p class="muted" style="margin:9px 0 13px">Explore classmates and campus communities. Everyone starts somewhere.</p><button class="soft" onclick="navigate('people')">Explore students →</button></div>`:reconnectionCards()}<div class="hint"><div><h3>Just moved to campus? You're in the right place. 👋</h3><p>Join a small group or host something simple. You don't need to know anyone first.</p></div><button class="primary" onclick="navigate('groups')">Explore groups ↗</button></div>`}
function presetExtra(){let c=selectedPreset;if(c==='Meals')return `<div class="extra-field"><div class="mini-label">Meal preset</div><div class="field"><label>Where are you eating?</label><select name="mealType"><option>Cafeteria</option><option>Eat out</option><option>Order delivery together</option></select></div><div class="field"><label>Dietary preferences</label><select name="dietary"><option>Ask attendees</option><option>Vegetarian-friendly</option><option>Halal-friendly</option><option>No pork</option></select></div><label class="small"><input type="checkbox" name="askAllergies" checked> Ask about food allergies</label></div>`;if(c==='Sports')return `<div class="extra-field"><div class="mini-label">Sports / gym preset</div><div class="field"><label>Sport</label><select name="sport"><option>Basketball</option><option>Football</option><option>Badminton</option><option>Running</option><option>Gym workout</option></select></div><div class="field"><label>Level</label><select name="level"><option>All levels</option><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></div><div class="field"><label>Illustrative time slot (not a real booking)</label><select name="slot"><option>17:00–18:00</option><option>18:00–19:00</option><option>19:00–20:00</option></select></div><p class="form-note">KAIST sports availability has not been connected. Check with the facility before hosting.</p></div>`;if(c==='Study')return `<div class="extra-field"><div class="mini-label">Study preset</div><div class="field"><label>Course code *</label><input name="course" placeholder="CE301 / PH101" required></div><div class="field"><label>Study topic</label><input name="topic" placeholder="Midterm review"></div><div class="field"><label>Room option</label><select name="room"><option>KAIST Library (check reservation separately)</option><option>Campus cafe</option><option>Dorm lounge</option></select></div><p class="form-note">Library rooms cannot be reserved from function create(){let presetChoices=[['Meals','Meal'],['Sports','Sports / gym'],['Study','Study'],['Games','Board game'],['Clubs','Club event'],['Outside','Outside'],['Other','Custom']];let titles={Meals:'Dinner together',Sports:'Casual basketball',Study:'Study session',Games:'Board game night',Clubs:'Club meetup',Outside:'Campus walk',Other:''};let places={Meals:'Cafeteria 2',Sports:'Sports field A',Study:'KAIST Library',Games:'W3 Dorm lounge',Clubs:'Campus center',Outside:'Duck Pond',Other:''};return `<div class="page-heading"><span class="eyebrow">MAKE SOMETHING HAPPEN</span><h1>Host a little something.</h1><p class="muted">A plan doesn't need to be complicated to bring people together.</p></div><div class="split"><div class="panel"><h3>01 / Pick a preset</h3><div class="preset-grid">${presetChoices.map(([c,label])=>`<button class="preset ${selectedPreset===c?'selected':''}" onclick="selectedPreset='${c}';render()"><strong>${emoji(c)}</strong>${label}</button>`).join('')}</div><h3 style="margin:24px 0 19px">02 / Make it yours</h3><form id="event-form"><div class="field"><label>Event name *</label><input name="title" required maxlength="90" placeholder="Your event title" value="${escapeHTML(titles[selectedPreset])}"></div><div class="form-grid"><div class="field"><label>Date & time *</label><input name="date" type="datetime-local" required value="${new Date(Date.now()+86400000).toLocaleDateString('en-CA')+'T18:00'}"></div><div class="field"><label>Capacity *</label><input name="capacity" type="number" min="2" max="200" value="8" required></div></div><div class="field"><label>Location *</label><input name="place" required value="${escapeHTML(places[selectedPreset])}" placeholder="Dorm lounge, cafe, library"></div>${presetExtra()}<div class="field"><label>Description</label><textarea name="desc" maxlength="600" placeholder="Tell people what to expect"></textarea></div><div class="field"><label>Question for guests (optional)</label><input name="question" placeholder="Food needs, materials, something else?"></div><div class="field"><label>Host as</label><select name="hostAs"><option value="Me">Me (student)</option>${(db.user?.verifiedHosts||[]).map(v=>`<option>${escapeHTML(v)}</option>`).join('')}</select><p class="form-note">Verified club/office hosting requires admin authorization in the real app.</p></div><label class="small"><input type="checkbox" name="firstTimers" checked> First-timers welcome</label><div class="field" style="margin-top:15px"><label>Who can see this?</label><select name="visibility"><option>All KAIST</option><option>Friends only</option><option>Invite only</option></select></div><button class="primary" style="width:100%;padding:15px" type="submit">Create event →</button></form></div><aside><div class="banner"><h3>Make it easy to say yes ✳</h3><p class="small muted" style="margin-top:9px">After creating the event, invite friends, share a link, or invite a group. Attendees can RSVP and share updates.</p></div><div class="panel" style="margin-top:15px"><h3>Campus integrations</h3><p class="muted small" style="margin-top:12px">Gym time slots and library room bookings shown here are sample choices, not verified availability. Check the real facilities separately.</p></div></aside></div>`}

function createEvent(ev){ev.preventDefault();let form=new FormData(ev.target),title=String(form.get('title')).trim(),place=String(form.get('place')).trim();let dt=new Date(form.get('date'));if(!title||!place||isNaN(dt)){notify('Please complete the event details');return}let id='e'+Date.now();let e={id,title,category:selectedPreset,date:dt.toISOString(),place,desc:String(form.get('desc')||''),host:me(),capacity:+form.get('capacity'),visibility:form.get('visibility'),going:[me()],maybe:[],no:[],checked:[],messages:[],photos:[],question:String(form.get('question')||''),answers:{},course:String(form.get('course')||''),mealType:String(form.get('mealType')||''),dietary:String(form.get('dietary')||''),askAllergies:!!form.get('askAllergies'),sport:String(form.get('sport')||''),level:String(form.get('level')||''),slot:String(form.get('slot')||''),topic:String(form.get('topic')||''),room:String(form.get('room')||''),bring:String(form.get('bring')||''),firstTimers:!!form.get('firstTimers'),hostAs:String(form.get('hostAs')||'Me'),verified:false,invited:[]};db.events.unshift(e);save();page='my';selected=e.id;modalTab='about';render();notify('Event created! Invite your people ✨');openEvent(id);modalTab='invite';renderEvent()}
function groupPage(){return `<div class="page-heading"><span class="eyebrow">FIND YOUR CIRCLE</span><h1>Groups are better together.</h1><p class="muted">Classes, clubs, dorm floors, or just a group of friends.</p></div><div class="row" style="margin-bottom:22px"><h2>Explore groups</h2><button class="primary" onclick="gated(()=>openGroupForm())">＋ New group</button></div><div class="group-grid">${db.groups.map(g=>{let joined=g.members.includes(me());return `<div class="group-card"><div class="row"><span class="tag purple">${escapeHTML(g.type)}</span><span class="small muted">${g.members.length} members</span></div><h3>${escapeHTML(g.name)}</h3><p class="muted">${escapeHTML(g.desc||'Meet your campus community!')}${g.visibility==='Invite only'?' · Invite only':''}</p><div class="row" style="margin-top:6px"><div class="avatars">${g.members.slice(0,4).map(av).join('')}</div><button class="${joined?'outline':'soft'}" onclick="gated(()=>toggleGroup('${g.id}'))">${joined?'✓ Joined':g.visibility==='Invite only'?'🔒 Invite only':'Join group ＋'}</button></div></div>`}).join('')}</div>`}
function toggleGroup(id){const g=db.groups.find(x=>x.id===id);if(!g)return;if(g.visibility==='Invite only'&&!g.members.includes(me())&&!(g.invited||[]).includes(me())){notify('This group is invite-only');return}if(g.members.includes(me()))g.members=g.members.filter(x=>x!==me());else g.members.push(me());save();render();notify(g.members.includes(me())?'You joined the group!':'Left group')}
function openGroupForm(){selected='group';renderModal(`<h2>Start a group ✨</h2><p class="muted" style="margin:8px 0 22px">Get your classmates, club, or dorm together.</p><form onsubmit="createGroup(event)"><div class="field"><label>Group name</label><input name="name" required maxlength="70" placeholder="e.g. Tuesday Dinner Crew"></div><div class="field"><label>Group type</label><select name="type"><option>Class</option><option>Club</option><option>Dorm</option><option>Friends</option><option>Other</option></select></div><div class="field"><label>Description</label><textarea name="desc" placeholder="What's this group about?"></textarea></div><button class="primary" style="width:100%">Create group</button></form>`)}
function createGroup(ev){ev.preventDefault();const d=new FormData(ev.target);db.groups.unshift({id:'g'+Date.now(),name:String(d.get('name')),type:String(d.get('type')),desc:String(d.get('desc')),visibility:String(d.get('visibility')||'Open'),members:[me()],invited:[]});save();selected=null;render();notify('Group created!')}
function myEvents(){
  const mine=db.events.filter(e=>e.host===me()&&!isPast(e)),joined=db.events.filter(e=>e.going.includes(me())&&e.host!==me()&&!isPast(e));
  const archive=db.events.filter(e=>isPast(e)&&(e.host===me()||e.going.includes(me()))).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const empty='<div class="empty">Nothing here yet.</div>';
  return `<div class="page-heading"><span class="eyebrow">YOUR CALENDAR</span><h1>Your kind of plans.</h1><p class="muted">Upcoming plans and memories from events you've attended.</p></div><div class="section-head"><h2>Hosting <span class="muted">(${mine.length})</span></h2><button class="soft" onclick="navigate('create')">＋ Host something</button></div>${mine.length?`<div class="event-grid">${mine.map(card).join('')}</div>`:empty}<div class="section-head"><h2>Going to <span class="muted">(${joined.length})</span></h2></div>${joined.length?`<div class="event-grid">${joined.map(card).join('')}</div>`:empty}<div class="section-head" id="archive"><div><span class="eyebrow">YOUR MEMORIES</span><h2>Archive <span class="muted">(${archive.length})</span></h2></div></div><p class="muted" style="margin-bottom:16px">Finished events stay here so you can reconnect with people you met.</p>${archive.length?`<div class="event-grid">${archive.map(card).join('')}</div>`:empty}`;
}
function mapPage(){let pins=[{x:20,y:28,label:'📚 Library',cat:'Study'},{x:69,y:31,label:'🏀 Sports field',cat:'Sports'},{x:35,y:72,label:'🏠 Dorm lounge',cat:'Games'},{x:72,y:71,label:'🍜 Cafeteria',cat:'Meals'}];return `<div class="page-heading"><span class="eyebrow">AROUND YOU</span><h1>Your campus, alive.</h1><p class="muted">Find things happening at familiar campus spots.</p></div><div class="split"><div><div class="mini-map">${pins.map(p=>`<button class="map-pin" style="left:${p.x}%;top:${p.y}%" onclick="showMapCat('${p.cat}')">${p.label}</button>`).join('')}<span class="map-label" style="left:39%;top:12%">KAIST CAMPUS</span><span class="map-label" style="left:7%;top:52%">GREEN SPACE</span><span class="map-label" style="left:55%;top:91%">CAMPUS WALK</span></div><p class="small muted" style="margin-top:12px">Illustrative campus diagram, not a live geographic map or facility booking system.</p></div><aside class="panel"><h3>What's happening nearby</h3><p class="muted small" style="margin:7px 0 18px">Tap a pin or open an event.</p><div class="side-list">${db.events.slice(0,7).map(e=>`<button class="person" style="border:0;text-align:left;width:100%" onclick="openEvent('${e.id}')"><span style="font-size:27px">${emoji(e.category)}</span><span class="person-info"><b>${escapeHTML(e.title)}</b><br><span class="small muted">${escapeHTML(e.place)} · ${dateFmt(e.date)}</span></span>→</button>`).join('')}</div></aside></div>`}

function profile(){return `<div class="page-heading"><span class="eyebrow">ABOUT YOU</span><h1>People make the place.</h1></div><div class="two-col"><div><div class="panel"><div class="profile-hero">${av(me())}<div><h2>${escapeHTML(db.user.name)}</h2><p class="muted">${escapeHTML(db.user.major)} · ${escapeHTML(db.user.year)} year</p><p class="small muted">${escapeHTML(db.user.email)}</p></div></div><div class="divider"></div><h3>Interests</h3><div style="margin:12px 0 22px">${(db.user.interests||[]).map(x=>`<span class="tag purple">${escapeHTML(x)}</span>`).join('')||'<span class="muted">None added yet</span>'}</div><h3>My classes</h3><div style="margin:12px 0 22px">${(db.user.classes||[]).map(x=>`<span class="tag">${escapeHTML(x)}</span>`).join('')||'<span class="muted">None added yet</span>'}</div><div class="notice small">Other profiles display shared classes only. This prototype does not connect to real KAIST course records.</div><h3>Clubs / work</h3><p class="muted" style="margin:9px 0 20px">${escapeHTML(db.user.clubs||'Nothing added yet')}</p><button class="outline" onclick="editProfile()">✎ Edit profile</button></div></div><aside><div class="panel"><h3>Campus connections ♡</h3><p class="muted small" style="margin:10px 0">Discover people with similar interests.</p><div class="side-list">${PEOPLE.slice(0,5).map(p=>personRow(p)).join('')}</div></div><button class="outline" style="margin-top:17px;width:100%" onclick="logout()">Switch demo profile / Log out</button></aside></div>`}
function matches(p){let a=[];if(db.user?.major&&p.major.toLowerCase()===db.user.major.toLowerCase())a.push('Same major');for(let x of p.interests||[])if((db.user?.interests||[]).some(y=>y.toLowerCase()===x.toLowerCase()))a.push(x);for(let x of p.classes||[])if((db.user?.classes||[]).some(y=>y.toLowerCase()===x.toLowerCase()))a.push('Class '+x);return a.slice(0,3)}function personRow(p){return `<div class="person">${av(p.id)}<div class="person-info"><b>${escapeHTML(p.name)}</b><br><span class="small muted">${escapeHTML(p.major)}</span></div><button class="outline" style="padding:8px 12px" onclick="openPerson('${p.id}')">View</button></div>`}
function friendEventHtml(id,p){
  if(!db.friends.includes(id)) return `<div class="notice small">🔒 Add ${escapeHTML(p.name.split(' ')[0])} as a friend to see which events they’re attending.</div>`;

}
function openPerson(id){let p=person(id);viewPerson=id;renderModal(`<div class="profile-hero">${av(id)}<div><h2>${escapeHTML(p.name)}</h2><p class="muted">${escapeHTML(p.major)} · ${escapeHTML(p.year)} year</p></div></div><div class="divider"></div><h3>In common with you</h3><p style="margin:12px 0 24px">${matches(p).map(x=>`<span class="tag purple">${escapeHTML(x)}</span>`).join('')||'<span class="muted">A new person to get to know!</span>'}</p><h3>Interests</h3><p style="margin:12px 0 24px">${(p.interests||[]).map(x=>`<span class="tag">${escapeHTML(x)}</span>`).join('')}</p><h3>Classes in common</h3><p style="margin:12px 0 24px">${(p.classes||[]).filter(x=>(db.user?.classes||[]).some(y=>y.toLowerCase()===x.toLowerCase())).map(x=>`<span class="tag">${escapeHTML(x)}</span>`).join('')||'<span class="muted">No shared classes shown.</span>'}</p><h3>Events they’re going to</h3><div style="margin:12px 0 24px">${friendEventHtml(id,p)}</div><button class="${db.friends.includes(id)?'outline':'primary'}" style="width:100%" onclick="toggleFriend('${id}')">${db.friends.includes(id)?'✓ Friends · Remove friend':'＋ Add friend'}</button>`)}function toggleFriend(id){db.friends=db.friends.includes(id)?db.friends.filter(x=>x!==id):[...db.friends,id];save();openPerson(id);notify(db.friends.includes(id)?'Friend added!':'Friend removed')}
function editProfile(){renderModal(`<h2>Edit your profile</h2><p class="muted" style="margin:8px 0 22px">Let your people find you.</p>${profileForm(true)}`)}function profileForm(edit=false){let u=db.user||{};return `<form onsubmit="submitProfile(event,${edit})"><div class="field"><label>Full name *</label><input name="name" required value="${escapeHTML(u.name||'')}" placeholder="Your name"></div>${!edit?`<div class="field"><label>KAIST email *</label><input name="email" type="email" required placeholder="you@kaist.ac.kr" value="${escapeHTML(u.email||'')}"></div>`:''}<div class="form-grid"><div class="field"><label>Major *</label><input name="major" required placeholder="e.g. Industrial Design" value="${escapeHTML(u.major||'')}"></div><div class="field"><label>Year</label><select name="year">${['1st','2nd','3rd','4th','Graduate','Other'].map(x=>`<option ${u.year===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>Classes this semester (comma-separated)</label><input name="classes" placeholder="CE301, ID302" value="${escapeHTML((u.classes||[]).join(', '))}"></div><div class="field"><label>Interests (comma-separated)</label><input name="interests" placeholder="Board games, Food, Running" value="${escapeHTML((u.interests||[]).join(', '))}"></div><div class="field"><label>Clubs, lab, internship, or part-time work (optional)</label><input name="clubs" placeholder="Climbing Club, lab assistant..." value="${escapeHTML(u.clubs||'')}"></div><div class="notice small">🔒 Only classes you share with another student appear on their view of your profile.</div><button class="primary" style="width:100%;padding:15px">${edit?'Save changes':'Create demo profile →'}</button></form>`}
function submitProfile(ev,edit){ev.preventDefault();let d=new FormData(ev.target),email=edit?db.user.email:String(d.get('email')).trim().toLowerCase();if(!email.endsWith('@kaist.ac.kr')){notify('Please use an @kaist.ac.kr email address');return}let old=db.user||{};db.user={id:'demo-me',email,name:String(d.get('name')).trim(),major:String(d.get('major')).trim(),year:String(d.get('year')),classes:String(d.get('classes')||'').split(',').map(x=>x.trim()).filter(Boolean),interests:String(d.get('interests')||'').split(',').map(x=>x.trim()).filter(Boolean),clubs:String(d.get('clubs')||''),classVisibility:'Shared classes only'};save();selected=null;navigate('home');notify(edit?'Profile updated!':'Welcome to kather. ✳')}function logout(){window.katherBridge?.logout()}function startFresh(){notify('Sign up with your KAIST email to start.');navigate('welcome')}
function welcome(){return `<div class="login-layout"><div class="login-art"><div class="brand">kather<span>.</span></div><div><span class="eyebrow">MADE FOR KAIST STUDENTS</span><h1>Make campus<br>feel smaller.</h1><p style="font-size:16px;line-height:1.7;max-width:375px;margin-top:22px">New friends, familiar faces, and the simple joy of doing things together.</p></div><p class="small">✳ No swipes. No pressure. Just real plans.</p></div><div class="login-form"><div class="panel"><div class="eyebrow">WELCOME TO YOUR PEOPLE</div><h2>${authMode==='signup'?'Join your campus community':'Welcome back'}</h2><p class="muted">${authMode==='signup'?'Create a demo student profile to explore kather.':'This prototype saves your profile in this browser.'}</p><div class="toggle"><button class="${authMode==='signup'?'active':''}" onclick="authMode='signup';render()">Sign up</button><button class="${authMode==='login'?'active':''}" onclick="authMode='login';render()">Log in</button></div>${authMode==='signup'?profileForm(false):`<form onsubmit="demoLogin(event)"><div class="field"><label>KAIST email</label><input type="email" name="email" required placeholder="you@kaist.ac.kr"></div><div class="field"><label>Password (demo only)</label><input type="password" name="password" placeholder="Not required in this demo"></div><button class="primary" style="width:100%">Continue →</button></form><p class="small muted" style="margin-top:16px">No real authentication is active. Use Sign up to create your local demo profile.</p>`}<div class="notice small">🔒 Prototype only: Enter fictional details. This is not KAIST SSO, and an email address is not actually verified. Please don't enter real passwords.</div><button class="outline" style="width:100%;margin-top:10px" onclick="db.user={id:'demo-me',email:'demo@kaist.ac.kr',name:'Alex Kim',major:'Industrial Design',year:'3rd',classes:['ID302','CE301'],interests:['Board games','Design','Food'],clubs:'Design Club',classVisibility:'Friends only'};save();navigate('home')">Explore with a demo profile ↗</button></div></div></div>`}function demoLogin(ev){ev.preventDefault();notify('This is a local prototype. Please use the demo profile or create a new one.')}
function openEvent(id){const e=db.events.find(x=>x.id===id);if(!e||!canViewEvent(e)){notify('This event is private or unavailable');return}selected=id;modalTab='about';renderEvent()}function status(e){if(e.going.includes(me()))return 'Going';if(e.maybe.includes(me()))return 'Maybe';if(e.no.includes(me()))return 'Can’t go';return 'Not responded'}function setRsvp(id,s){gated(()=>{let e=db.events.find(x=>x.id===id);if(!e)return;let nowGoing=e.going.includes(me());if(s==='going'&&!nowGoing&&e.going.length>=e.capacity){notify('This event is full');return}e.going=e.going.filter(x=>x!==me());e.maybe=e.maybe.filter(x=>x!==me());e.no=e.no.filter(x=>x!==me());if(s==='going')e.going.push(me());if(s==='maybe')e.maybe.push(me());if(s==='no')e.no.push(me());save();renderEvent();notify(s==='going'?"You're going! 🎉":'RSVP updated');})}
function renderModal(content,big=false){$('.modal-mask')?.remove();let m=document.createElement('div');m.className='modal-mask';m.onclick=e=>{if(e.target===m)closeModal()};m.innerHTML=`<div class="modal ${big?'big':''}" role="dialog" aria-modal="true"><button class="close" aria-label="Close" onclick="closeModal()">×</button><div class="modal-content">${content}</div></div>`;document.body.appendChild(m);document.body.style.overflow='hidden'}
function closeModal(){selected=null;$('.modal-mask')?.remove();document.body.style.overflow=''}
function eventAbout(e,own,friends){let html=isPast(e)?`<div class="notice">This event is finished and now appears in your Archive. Check the Photos tab to reconnect with attendees.</div>`:"";html+=`<p style="line-height:1.8;margin-bottom:19px">${escapeHTML(e.desc||'Come along and meet your people!')}</p>`;if(e.firstTimers)html+='<span class="badge-new">✳ First-timers welcome</span> ';if(e.sponsor)html+=`<div class="notice" style="margin:12px 0">✓ ${escapeHTML(e.sponsor)}</div>`;if(e.sport)html+=`<p class="small muted">${escapeHTML(e.sport)} · ${escapeHTML(e.level||'All levels')} · ${escapeHTML(e.slot||'')}</p>`;if(e.dietary)html+=`<p class="small muted">Dietary: ${escapeHTML(e.dietary)}</p>`;if(e.course)html+=`<span class="tag">${escapeHTML(e.course)}</span>`;if(e.mealType)html+=`<span class="tag orange">${escapeHTML(e.mealType)}</span>`;if(isPast(e))html+=`<div class="notice small">RSVPs are closed for finished events.</div>`;else if(own)html+='<div class="notice">You’re hosting! View Host tools to manage guests.</div>';else html+=`<p class="small bold" style="margin:22px 0 9px">Your RSVP: ${status(e)}</p><div class="seg">${[['going','✓ Going'],['maybe','? Maybe'],['no','✕ Can’t go']].map(([k,v])=>`<button class="outline" onclick="setRsvp('${e.id}','${k}')">${v}</button>`).join('')}</div>`;if(e.category==='Meals'&&e.going.includes(me())&&!own)html+=`<div class="field" style="margin-top:15px"><label>Your food preference</label><select id="food-pref" onchange="saveFoodPreference('${e.id}',this.value)">${['None','Vegetarian','Halal','No pork','Allergy — tell host'].map(x=>`<option ${db.preferences[e.id]===x?'selected':''}>${x}</option>`).join('')}</select></div>`;if(e.question&&e.going.includes(me())&&!own)html+=`<form onsubmit="answerQuestion(event,'${e.id}')" style="margin-top:18px"><div class="field"><label>Host asks: ${escapeHTML(e.question)}</label><input name="answer" maxlength="150" value="${escapeHTML(e.answers?.[me()]||'')}" placeholder="Your answer..."></div><button class="outline">Save answer</button></form>`;html+=`<div class="divider"></div><h3>Who's coming</h3><div class="side-list" style="margin-top:13px">${e.going.map(id=>personRow(person(id))).join('')}</div><div class="divider"></div>${friends.length?`<h3>Friends going ♡</h3><p class="muted" style="margin:10px 0 18px">${friends.map(x=>person(x).name).join(', ')}</p>`:''}<h3>People you might click with ✨</h3>`;let people=e.going.filter(x=>x!==me()&&!db.friends.includes(x)).map(person).sort((a,b)=>matches(b).length-matches(a).length);html+=`<div class="side-list" style="margin-top:12px">${people.slice(0,3).map(p=>`<div class="person">${av(p.id)}<div class="person-info"><b>${escapeHTML(p.name)}</b><br><span class="small muted">${escapeHTML(matches(p).join(' · ')||'A new connection')}</span></div><button class="outline" onclick="openPerson('${p.id}')">View</button></div>`).join('')||'<p class="muted">Come along and meet some new people!</p>'}</div><div class="divider"></div><div class="btn-line"><button class="outline" onclick="shareEvent('${e.id}')">↗ Copy invite link</button><button class="outline" onclick="downloadICS('${e.id}')">＋ Add to calendar</button><button class="outline" onclick="sendReminder('${e.id}')">🔔 Remind me</button><button class="outline" onclick="bringFriend('${e.id}')">＋ Bring a friend</button></div>`;return html}
function eventUpdates(e){
  const allowed=e.host===me()||(e.going||[]).includes(me());
  if(!allowed)return `<div class="notice">🔒 Event chat is available to the host and students marked <b>Going</b>. Join the event from <b>Details & RSVP</b> to start chatting.</div>`;
  const chat=(e.messages||[]).map(m=>`<div class="feed-msg"><b>${escapeHTML(m.who||'Student')}</b><span class="micro muted" style="margin-left:8px">${m.createdAt?escapeHTML(new Date(m.createdAt).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})):''}</span><p style="margin-top:5px;white-space:pre-wrap;overflow-wrap:anywhere">${escapeHTML(m.text)}</p></div>`).join('')||'<p class="muted">No messages yet. Say hello! 👋</p>';
  return `<div class="notice">💬 Live event chat · Messages sync across devices. Only the host and students marked Going can access this chat.</div><div id="live-chat-messages" aria-live="polite" style="max-height:340px;overflow:auto">${chat}</div><form onsubmit="sendMessage(event,'${e.id}')" id="live-chat-form" style="display:flex;gap:9px;margin-top:20px"><input name="message" required maxlength="250" placeholder="Write a message..." aria-label="Write a message" style="flex:1;min-width:0;border-radius:15px;border:1px solid #e0e6de;padding:13px"><button class="primary" type="submit">Send</button></form><div class="divider"></div><div class="row"><span>Already here?</span><button class="soft" onclick="checkMeIn('${e.id}')">${e.checked.includes(me())?'✓ Checked in':'📍 I’m here'}</button></div><p class="small muted" style="margin-top:10px">${e.checked.length} people checked in</p><div class="btn-line"><button class="outline" onclick="quickLate('${e.id}')">Running late</button><button class="outline" onclick="locationPin('${e.id}')">📍 Open location</button></div>`;
}
function eventPhotos(e){return `<h3>${isPast(e)?"Memories from your hangout 📷":"Event album 📷"}</h3><p class="muted small" style="margin:7px 0 18px">Photos can be previewed here, but shared uploads require Firebase Storage.</p><div class="photo-grid">${(e.photos||[]).map(src=>`<img src="${src}" alt="Shared event photo" style="width:100%;height:130px;object-fit:cover;border-radius:13px">`).join('')||'<div class="photo" style="grid-column:1/-1">📸</div>'}</div><label class="outline" style="margin-top:15px">＋ Add photo <input type="file" accept="image/*" onchange="addPhoto(event,'${e.id}')" hidden></label><div class="divider"></div><h3>Keep the connection going</h3><p class="muted" style="margin:10px 0 15px">Don't let this be a one-time thing.</p><div class="side-list" style="margin:10px 0">${e.going.filter(id=>id!==me()).map(id=>`<div class="person">${av(id)}<span class="person-info">${escapeHTML(person(id).name)}</span><button class="outline" onclick="openPerson('${id}')">${db.friends.includes(id)?'✓ Friend':'Add friend'}</button></div>`).join('')}</div><button class="soft" onclick="newMeetup('${e.id}')">✳ Plan another hangout</button>`}
function eventHost(e){let guests=[...e.going.map(id=>[id,'Going']),...e.maybe.map(id=>[id,'Maybe']),...e.no.map(id=>[id,'Can’t go'])];return `<h3>Guest list</h3><p class="muted" style="margin:9px 0 13px">Going: ${e.going.length} · Maybe: ${e.maybe.length} · Can’t: ${e.no.length}</p><div class="side-list">${guests.map(([id,s])=>`<div class="person">${av(id)}<div class="person-info"><b>${escapeHTML(person(id).name)}</b><br><span class="small muted">${s}${e.answers?.[id]?' · '+escapeHTML(e.answers[id]):''}</span></div><button class="outline" onclick="hostCheckin('${e.id}','${id}')">${e.checked.includes(id)?'✓ Here':'Check in'}</button></div>`).join('')}</div><div class="divider"></div><h3>Food needs & answers</h3><p class="muted small" style="margin:12px 0">${e.going.map(id=>e.answers?.[id]?person(id).name+': '+e.answers[id]:'').filter(Boolean).map(escapeHTML).join('<br>')||'No answers yet'}</p><div class="divider"></div><form onsubmit="hostUpdate(event,'${e.id}')"><div class="field"><label>Send an update to guests</label><textarea name="update" required placeholder="e.g. We moved to the second floor lounge!"></textarea></div><button class="primary">Post update</button></form><div class="divider"></div><div class="btn-line"><button class="outline" onclick="modalTab='invite';renderEvent()">✉ Invite people</button><button class="outline" onclick="exportGuests('${e.id}')">⇩ Export guest list</button><button class="outline" onclick="locationPin('${e.id}')">📍 Share location</button></div>`}
function renderEvent(){let e=db.events.find(x=>x.id===selected);if(!e)return;let own=e.host===me(),friends=e.going.filter(x=>db.friends.includes(x));let tabs=['about','updates','photos',...(own?['host','invite']:[])];let content={about:()=>eventAbout(e,own,friends),updates:()=>eventUpdates(e),photos:()=>eventPhotos(e),host:()=>eventHost(e),invite:()=>eventInvite(e)}[modalTab]();let hostBtn=own?`closeModal();navigate('profile')`:`openPerson('${e.host}')`;let detail=`<div class="modal-art" style="background:${color(e.category)}">${emoji(e.category)}</div><div class="modal-content"><span class="tag purple">${escapeHTML(e.category)}</span> ${e.verified?'<span class="badge-verified">✓ Verified host</span>':''}<h2 class="event-title">${escapeHTML(e.title)}</h2><p style="line-height:1.9;color:#5d6e63">📅 ${dateFmt(e.date)} at ${timeFmt(e.date)}<br>📍 ${escapeHTML(e.place)}<br>✳ Hosted by <button onclick="${hostBtn}" style="background:none;border:0;text-decoration:underline;color:inherit;padding:0">${escapeHTML(e.hostAs&&e.hostAs!=='Me'?e.hostAs:person(e.host).name)} ${e.verified?'✓':''}</button></p><div class="stat-row"><div><b>${e.going.length}/${e.capacity}</b><span class="muted small">Going</span></div><div><b>${e.maybe.length}</b><span class="muted small">Maybe</span></div><div><b>${friends.length||'—'}</b><span class="muted small">Friends going</span></div></div><div class="tab-row">${tabs.map(t=>`<button class="${modalTab===t?'active':''}" onclick="modalTab='${t}';renderEvent()">${{about:'Details & RSVP',updates:'Updates & chat',photos:'Photo album',host:'Host tools',invite:'Invite people'}[t]}</button>`).join('')}</div>${content}</div>`;$('.modal-mask')?.remove();let mask=document.createElement('div');mask.className='modal-mask';mask.onclick=ev=>{if(ev.target===mask)closeModal()};mask.innerHTML=`<div class="modal big" role="dialog" aria-modal="true"><button class="close" onclick="closeModal()">×</button>${detail}</div>`;document.body.appendChild(mask);document.body.style.overflow='hidden'}
function answerQuestion(ev,id){ev.preventDefault();const e=db.events.find(x=>x.id===id);e.answers=e.answers||{};e.answers[me()]=new FormData(ev.target).get('answer');save();notify('Answer saved')};function sendMessage(ev,id){ev.preventDefault();const f=new FormData(ev.target),msg=String(f.get('message')||'').trim();if(!msg)return;const e=db.events.find(x=>x.id===id);e.messages.push({who:db.user.name,text:msg});save();renderEvent()};function checkMeIn(id){gated(()=>{const e=db.events.find(x=>x.id===id);if(!e.going.includes(me())){notify('RSVP Going first');return}if(!e.checked.includes(me()))e.checked.push(me());save();renderEvent();notify('Checked in!')})};function hostCheckin(id,user){const e=db.events.find(x=>x.id===id);if(e.host!==me())return;e.checked=e.checked.includes(user)?e.checked.filter(x=>x!==user):[...e.checked,user];save();renderEvent()};function hostUpdate(ev,id){ev.preventDefault();const e=db.events.find(x=>x.id===id);if(e.host!==me())return;e.messages.push({who:db.user.name+' · Host',text:new FormData(ev.target).get('update')});save();modalTab='updates';renderEvent();notify('Update posted')};function shareEvent(id){const u=location.href.split('#')[0]+'#event='+encodeURIComponent(id);if(navigator.clipboard&&location.protocol!=='file:')navigator.clipboard.writeText(u).then(()=>notify('Link copied!')).catch(()=>prompt('Copy invite link:',u));else prompt('Copy invite link:',u)}function repeatEvent(id){let e=db.events.find(x=>x.id===id);selectedPreset=e.category;closeModal();navigate('create');notify('Create another event with this preset ✳')};function addPhoto(ev,id){
 const f=ev.target.files?.[0];if(!f)return;
 if(!f.type.startsWith('image/'))return notify('Select an image file');

function combinedNotifications(){

   if((e.invited||[]).includes(me())&&!(e.going||[]).includes(me()))items.push({key:'invite-'+e.id,kind:'invite',title:'You’re invited!',text:e.title,at:new Date(e.createdAt?.seconds?e.createdAt.seconds*1000:e.date).getTime(),event:e.id});

 }

}

window.handlePasswordReset=async function(ev){
  ev.preventDefault();

let chatConnectedEvent=null;
function canUseChat(e){return !!db.user&&!!e&&(e.host===me()||(e.going||[]).includes(me()))}
function connectSelectedChat(id){
  const e=db.events.find(x=>x.id===id);
  if(!canUseChat(e)||!live()?.ready){
    if(msgUnsubscribe){msgUnsubscribe();msgUnsubscribe=null}
    chatConnectedEvent=null;
    return;
  }
  if(chatConnectedEvent===id&&msgUnsubscribe)return;
  if(msgUnsubscribe){msgUnsubscribe();msgUnsubscribe=null}
  chatConnectedEvent=id;
  msgUnsubscribe=live().listenMessages(id,msg=>{
    remoteMessages[id]=msg;
    const eventRecord=db.events.find(x=>x.id===id);
    if(eventRecord)eventRecord.messages=msg;
    if(selected!==id||!document.querySelector('.modal-mask')||modalTab!=='updates')return;
    const output=document.querySelector('#live-chat-messages');
    if(output){const fresh=document.createElement('div');fresh.innerHTML=eventUpdates(eventRecord);const updated=fresh.querySelector('#live-chat-messages');if(updated){output.innerHTML=updated.innerHTML;output.scrollTop=output.scrollHeight}}
    else renderEvent();

}

<script type="module">import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js';
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendEmailVerification, signOut, updateProfile, sendPasswordResetEmail } from 'https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js';

const app=initializeApp({apiKey:'AIzaSyAiksk7DKrKg-7rKaLZqB6B5s9cIjYwQVM',authDomain:'kather-aa14f.firebaseapp.com',projectId:'kather-aa14f',storageBucket:'kather-aa14f.firebasestorage.app',messagingSenderId:'39434608007',appId:'1:39434608007:web:1e6ccac9ad670e74484722',measurementId:'G-L0V080TED1'});
const auth=getAuth(app),firestore=getFirestore(app);
const campusEmail=email=>/^[^\s@]+@kaist\.ac\.kr$/i.test(email||'');
const student=()=>{const u=auth.currentUser;if(!u||!u.emailVerified||!campusEmail(u.email))throw Error('Log in and verify your KAIST email first');return u};
const pair=(a,b)=>[a,b].sort().join('__');
let unsubs=[],eventSets={},groupSets={},requestSets={};let alertUnsubs=[];
function stop(){unsubs.forEach(fn=>fn());alertUnsubs.forEach(fn=>fn());alertUnsubs=[];unsubs=[];eventSets={};groupSets={};requestSets={};window.katherChatLatest={}}
function subscribe(q,cb){unsubs.push(onSnapshot(q,cb,e=>{console.error('Firestore listener failed:',e);window.notify?.('Database access issue: '+e.message)}))}
function mergeSet(whereTo,setMap,name){setMap[name]=whereTo;return [...new Map(Object.values(setMap).flat().map(x=>[x.id,x])).values()]}

function watchRecentMessages(events,uid){
 alertUnsubs.forEach(fn=>fn());alertUnsubs=[];
 const relevant=events.filter(e=>e.host===uid||(e.going||[]).includes(uid)).slice(0,12);
 relevant.forEach(e=>{
  const q=query(collection(firestore,'campusEvents',e.id,'messages'),orderBy('createdAt','desc'),limit(1));
  alertUnsubs.push(onSnapshot(q,snap=>{
   const list=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
   window.katherChatLatest=window.katherChatLatest||{};
   if(list.length)window.katherChatLatest[e.id]=list[0];
   window.updateBell?.();
  },err=>console.warn('Notification chat listener unavailable:',err.code)));
 });
}
function listenLive(uid){
  subscribe(query(collection(firestore,'campusProfiles')),snap=>window.katherOnProfiles(snap.docs.map(d=>({id:d.id,...d.data()}))));
  const ev=collection(firestore,'campusEvents');
  [['public',query(ev,where('visibility','==','All KAIST'))],['host',query(ev,where('host','==',uid))],['invited',query(ev,where('invited','array-contains',uid))]].forEach(([key,q])=>subscribe(q,snap=>{const vals=snap.docs.map(d=>({id:d.id,...d.data()}));window.katherOnEvents(mergeSet(vals,eventSets,key))}));
  const gr=collection(firestore,'campusGroups');
  [['open',query(gr,where('visibility','==','Open'))],['member',query(gr,where('members','array-contains',uid))],['invited',query(gr,where('invited','array-contains',uid))]].forEach(([key,q])=>subscribe(q,snap=>window.katherOnGroups(mergeSet(snap.docs.map(d=>({id:d.id,...d.data()})),groupSets,key))));
  const fr=collection(firestore,'campusFriendRequests');
  function updateRequests(key,snap){requestSets[key]=snap.docs.map(d=>({id:d.id,...d.data()}));const req={};const friends=[];for(const r of [...new Map(Object.values(requestSets).flat().map(x=>[x.id,x])).values()]){const other=r.from===uid?r.to:r.from;req[other]=r;if(r.status==='accepted')friends.push(other)}window.katherOnFriends(friends,req)}
  subscribe(query(fr,where('from','==',uid)),snap=>updateRequests('out',snap));
  subscribe(query(fr,where('to','==',uid)),snap=>updateRequests('in',snap));
}
let alertTimer=null;
window.refreshChatAlerts=function(events){clearTimeout(alertTimer);alertTimer=setTimeout(()=>{const u=auth.currentUser;if(u?.emailVerified)watchRecentMessages(events,u.uid)},300)};
const bridge={
  ready:true,
  signup:async(name,email,password)=>{if(!campusEmail(email))throw Error('Use an @kaist.ac.kr email');if(!name)throw Error('Please enter your name');const {user}=await createUserWithEmailAndPassword(auth,email.toLowerCase(),password);await updateProfile(user,{displayName:name});await sendEmailVerification(user)},
  login:async(email,password)=>{if(!campusEmail(email))throw Error('Use your KAIST email');await signInWithEmailAndPassword(auth,email.toLowerCase(),password)},
  resetPassword:async(email)=>{const address=String(email||'').trim().toLowerCase();if(!campusEmail(address))throw Error('Use your KAIST email');await sendPasswordResetEmail(auth,address)},
  logout:()=>signOut(auth),
  refreshVerification:async()=>{if(!auth.currentUser)return;await auth.currentUser.reload();await auth.currentUser.getIdToken(true);await handleAuth(auth.currentUser)},
  resendVerification:async()=>sendEmailVerification(auth.currentUser),
  saveProfile:async(profile,privateData)=>{const uid=student().uid;await setDoc(doc(firestore,'campusProfiles',uid),{...profile,updatedAt:serverTimestamp()},{merge:true});await setDoc(doc(firestore,'campusPrivateProfiles',uid),{classes:privateData.classes,updatedAt:serverTimestamp()},{merge:true})},
  createEvent:async(e)=>{const u=student();const ref=await addDoc(collection(firestore,'campusEvents'),{...e,foodPreferences:{},host:u.uid,hostName:u.displayName||'KAIST student',createdAt:serverTimestamp()});return ref.id},
  setRsvp:async(id,s)=>{const u=student();const ref=doc(firestore,'campusEvents',id);await runTransaction(firestore,async tx=>{const snap=await tx.get(ref);if(!snap.exists())throw Error('Event not found');const e=snap.data();const going=(e.going||[]).filter(x=>x!==u.uid),maybe=(e.maybe||[]).filter(x=>x!==u.uid),no=(e.no||[]).filter(x=>x!==u.uid);if(s==='going'){if(going.length>=e.capacity)throw Error('This event is full');going.push(u.uid)}else if(s==='maybe')maybe.push(u.uid);else if(s==='no')no.push(u.uid);tx.update(ref,{going,maybe,no})})},
  createGroup:async(g)=>{student();await addDoc(collection(firestore,'campusGroups'),{...g,createdAt:serverTimestamp()})},
  toggleGroup:async(id)=>{const uid=student().uid;const ref=doc(firestore,'campusGroups',id);await runTransaction(firestore,async tx=>{let snap=await tx.get(ref);if(!snap.exists())throw Error('Group not found');let g=snap.data(),joined=g.members.includes(uid);if(!joined&&g.visibility==='Invite only'&&!(g.invited||[]).includes(uid))throw Error('Invitation required');tx.update(ref,{members:joined?g.members.filter(x=>x!==uid):[...g.members,uid]})})},
  inviteToGroup:async(id,uid)=>{const actor=student().uid;const ref=doc(firestore,'campusGroups',id);await runTransaction(firestore,async tx=>{const snap=await tx.get(ref);if(!snap.exists()||snap.data().owner!==actor)throw Error('Only the group creator can invite people');tx.update(ref,{invited:[...new Set([...(snap.data().invited||[]),uid])].slice(0,200)})})},
  requestFriend:async(id)=>{const uid=student().uid;if(uid===id)throw Error('Cannot add yourself');await setDoc(doc(firestore,'campusFriendRequests',pair(uid,id)),{from:uid,to:id,status:'pending',createdAt:serverTimestamp()})},
  acceptFriend:async(id)=>{const uid=student().uid;await updateDoc(doc(firestore,'campusFriendRequests',pair(uid,id)),{status:'accepted'})},
  removeFriend:async(id)=>deleteDoc(doc(firestore,'campusFriendRequests',pair(student().uid,id))),
  listenMessages:(id,cb)=>onSnapshot(query(collection(firestore,'campusEvents',id,'messages')),snap=>cb(snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0)).slice(-100).map(x=>({who:x.name||'Student',text:x.text,createdAt:x.createdAt?.toDate?.()?.toISOString()||''}))),e=>{console.error('Chat listener:',e);window.notify?.('Chat access issue: '+e.message)}),
  sendMessage:async(id,text)=>{const u=student();if(!text.trim()||text.length>250)throw Error('Message must be 1–250 characters');await addDoc(collection(firestore,'campusEvents',id,'messages'),{uid:u.uid,name:u.displayName||'Student',text:text.trim(),createdAt:serverTimestamp()})},
  checkin:async(id,uid)=>{const actor=student().uid;const ref=doc(firestore,'campusEvents',id);await runTransaction(firestore,async tx=>{const snap=await tx.get(ref);if(!snap.exists())throw Error('Event not found');const e=snap.data();if(actor!==e.host&&actor!==uid)throw Error('Only the host can check in other guests');if(!e.going.includes(uid))throw Error('Student is not going');tx.update(ref,{checked:e.checked.includes(uid)?e.checked.filter(x=>x!==uid):[...e.checked,uid]})})},
  invite:async(id,inviteIds)=>{const actor=student().uid;const ref=doc(firestore,'campusEvents',id);await runTransaction(firestore,async tx=>{let snap=await tx.get(ref);if(!snap.exists()||snap.data().host!==actor)throw Error('Only the host can invite');tx.update(ref,{invited:[...new Set([...(snap.data().invited||[]),...inviteIds])].slice(0,200)})})},
  answerQuestion:async(id,answer)=>{const uid=student().uid;const ref=doc(firestore,'campusEvents',id);await runTransaction(firestore,async tx=>{const snap=await tx.get(ref);if(!snap.exists())throw Error('Event not found');tx.update(ref,{answers:{...(snap.data().answers||{}),[uid]:answer.slice(0,150)}})})},
  saveFoodPreference:async(id,value)=>{const uid=student().uid;const ref=doc(firestore,'campusEvents',id);await runTransaction(firestore,async tx=>{const snap=await tx.get(ref);if(!snap.exists())throw Error('Event not found');tx.update(ref,{foodPreferences:{...(snap.data().foodPreferences||{}),[uid]:value}})})}
};
window.katherBridge=bridge;
async function handleAuth(u){stop();if(!u||!u.emailVerified||!campusEmail(u.email)){window.katherOnAuth(u,null,null);return}await u.getIdToken(true);try{const [p,priv]=await Promise.all([getDoc(doc(firestore,'campusProfiles',u.uid)),getDoc(doc(firestore,'campusPrivateProfiles',u.uid))]);await window.katherOnAuth(u,p.exists()?p.data():null,priv.exists()?priv.data():null);listenLive(u.uid)}catch(err){console.error(err);window.notify?.('Firebase permission error: '+err.message)}}
onAuthStateChanged(auth,handleAuth);
</script>

<script>
// Event form: do not allow a native GET submit/reload to return users to login.
document.addEventListener('submit', function(event) {
  if (event.target && event.target.id === 'event-form') {
    event.preventDefault();
    event.stopPropagation();
    if (typeof window.createEvent !== 'function' || !window.katherBridge?.ready) {
      window.notify?.('Firebase is not ready. Refresh the page and sign in again.');
      console.error('Event submit failed: Firebase bridge is not ready');
      return;
    }
    try {
      Promise.resolve(window.createEvent(event)).catch(error => {
        console.error('Create event failed:', error);
        window.notify?.('Could not create event: ' + (error?.message || error));
      });
    } catch (error) {
      console.error('Create event failed:', error);
      window.notify?.('Could not create event: ' + (error?.message || error));
    }
  }
}, true);
</script>
